<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCTANE CODE — Staff</title><style>body{background:#080e18;color:#edf5ff;font:16px system-ui;margin:0}main{max-width:850px;margin:6vh auto;padding:25px}h1{color:#62b9ff}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 15px;background:#14243a;border:1px solid #345170;border-radius:9px;color:white;font:inherit}button{background:#0879c7;cursor:pointer}button:disabled{opacity:.5}label{display:block}article{background:#101c2e;border:1px solid #2a4767;padding:22px;border-radius:15px;margin:15px 0}.hide{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}small{color:#a9bfd6}a{color:#8acaff}</style><main><a href="./">← OCTANE CODE</a><h1>Portail Staff</h1><p id="message" role="status">Connexion sécurisée Supabase.</p><article id="login"><form id="loginform"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Mot de passe<input id="password" type="password" autocomplete="current-password" required></label><button>Connexion</button></form></article><div id="app" class="hide"><p>Connecté en tant que <b id="who"></b> (<span id="role"></span>)</p><button id="logout">Déconnexion</button><article><h2>Nouveau devis</h2><form id="quoteform"><label>Référence client<input name="client_ref" maxlength="120" required></label><label>Véhicule<input name="vehicle" maxlength="120" placeholder="BMW E38 740i" required></label><label>Rétrofit<input name="retrofit" maxlength="180" placeholder="PDC OEM" required></label><div class="grid"><label>Coût pièces HT (€)<input name="parts_cost" type="number" min="0" step=".01" value="0" required></label><label>Majoration pièces (%)<input name="parts_markup" type="number" min="0" max="1000" step=".01" value="0" required></label><label>Heures de travail<input name="hours" type="number" min="0" step=".01" value="0" required></label><label>Taux horaire HT (€)<input name="hourly_rate" type="number" min="0" step=".01" value="0" required></label><label>Autres frais HT (€)<input name="extra_cost" type="number" min="0" step=".01" value="0" required></label><label>Statut<select name="status"><option value="brouillon">Brouillon</option><option value="a_etudier">À étudier</option><option value="envoye">Envoyé</option><option value="accepte">Accepté</option><option value="refuse">Refusé</option></select></label></div><label>Notes<textarea name="notes" maxlength="5000"></textarea></label><p>Total HT estimé : <b id="total">0,00 €</b></p><button>Enregistrer le devis</button></form></article><article><h2>Devis enregistrés</h2><div id="quotes"></div></article></div><small>Accès contrôlé par Supabase Auth et les règles RLS. Ne jamais placer une clé secrète dans le navigateur.</small></main><script src="staff-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const cfg=window.OCTANE_SUPABASE,db=window.supabase.createClient(cfg.url,cfg.anonKey),el=id=>document.getElementById(id),say=t=>el('message').textContent=t;
async function refresh(){const {data:{user},error}=await db.auth.getUser();if(error||!user){el('login').classList.remove('hide');el('app').classList.add('hide');return}const r=await db.from('staff_members').select('role').eq('user_id',user.id).maybeSingle();if(r.error||!r.data){say('Compte connecté mais accès staff non autorisé. Vérifie le rôle et les politiques RLS.');el('login').classList.add('hide');el('app').classList.add('hide');return}el('login').classList.add('hide');el('app').classList.remove('hide');el('who').textContent=user.email;el('role').textContent=r.data.role;say('Accès staff autorisé.');await load()}
el('loginform').onsubmit=async e=>{e.preventDefault();say('Connexion en cours…');const {error}=await db.auth.signInWithPassword({email:el('email').value,password:el('password').value});el('password').value='';if(error){say('Connexion refusée : '+error.message);return}await refresh()};
el('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
function values(){const f=new FormData(el('quoteform'));const x=Object.fromEntries(f.entries());for(const k of ['parts_cost','parts_markup','hours','hourly_rate','extra_cost'])x[k]=Number(x[k]);return x}
function total(x){return x.parts_cost*(1+x.parts_markup/100)+x.hours*x.hourly_rate+x.extra_cost}
function money(n){return n.toLocaleString('fr-FR',{style:'currency',currency:'EUR'})}
el('quoteform').oninput=()=>el('total').textContent=money(total(values()));
el('quoteform').onsubmit=async e=>{e.preventDefault();const x=values();const {error}=await db.from('quotes').insert(x);if(error){say('Échec enregistrement : '+error.message);return}say('Devis enregistré.');el('quoteform').reset();el('total').textContent=money(0);await load()};
async function load(){const {data,error}=await db.from('quotes').select('id,client_ref,vehicle,retrofit,status,parts_cost,parts_markup,hours,hourly_rate,extra_cost,created_at').order('created_at',{ascending:false}).limit(50);const target=el('quotes');target.replaceChildren();if(error){say('Lecture des devis impossible : '+error.message);return}if(!data.length){target.textContent='Aucun devis pour le moment.';return}for(const x of data){const p=document.createElement('p');p.textContent=x.client_ref+' — '+x.vehicle+' — '+x.retrofit+' — '+money(total(x))+' HT — '+x.status;target.append(p)}}
refresh().catch(e=>say('Erreur : '+e.message));
</script></html>
